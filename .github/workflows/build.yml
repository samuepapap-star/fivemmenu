name: Build Wexize EXE

on:
  push:
    branches: [ main, feature/shark-integration, feature/source-additions, codex/build-3889-bridge ]
  workflow_dispatch:

jobs:
  skinchanger-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Test authorized SkinChanger
        run: lua5.4 tests/skinchanger_authorized.lua

  build:
    needs: skinchanger-tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Testa opcoes portadas das sources
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX /UNDEBUG tests\source_option_logic.cpp /Fe:source_option_logic.exe
          if errorlevel 1 exit /b 1
          source_option_logic.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /UNDEBUG tests\world_clock.cpp /Fe:world_clock.exe
          if errorlevel 1 exit /b 1
          world_clock.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /UNDEBUG tests\native_candidate_logic.cpp /Fe:native_candidate_logic.exe
          if errorlevel 1 exit /b 1
          native_candidate_logic.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /UNDEBUG tests\roll_spin_logic.cpp /Fe:roll_spin_logic.exe
          if errorlevel 1 exit /b 1
          roll_spin_logic.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /UNDEBUG tests\native_actions.cpp /Fe:native_actions.exe
          if errorlevel 1 exit /b 1
          native_actions.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /UNDEBUG tests\native_player_names.cpp /Fe:native_player_names.exe
          if errorlevel 1 exit /b 1
          native_player_names.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /UNDEBUG tests\native_camera.cpp /Fe:native_camera.exe
          if errorlevel 1 exit /b 1
          native_camera.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /UNDEBUG tests\native_vehicle_transfer.cpp /Fe:native_vehicle_transfer.exe
          if errorlevel 1 exit /b 1
          native_vehicle_transfer.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /UNDEBUG tests\menu_scale_logic.cpp /Fe:menu_scale_logic.exe
          if errorlevel 1 exit /b 1
          menu_scale_logic.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /UNDEBUG tests\model_catalog.cpp /Fe:model_catalog.exe
          if errorlevel 1 exit /b 1
          model_catalog.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /UNDEBUG tests\bridge_build_policy.cpp /Fe:bridge_build_policy.exe
          if errorlevel 1 exit /b 1
          bridge_build_policy.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /UNDEBUG tests\native_waypoint.cpp /Fe:native_waypoint.exe
          if errorlevel 1 exit /b 1
          native_waypoint.exe
          if errorlevel 1 exit /b 1
          if not exist x64\Release mkdir x64\Release
          lib /nologo /machine:x64 /def:native\cfx\rage-scripting-five.def /out:native\cfx\rage-scripting-five.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /MD /O2 /utf-8 /W4 /LD native\FiveMMenuBridge.cpp native\cfx\rage-scripting-five.lib /link /OUT:x64\Release\FiveMMenuBridge.dll
          if errorlevel 1 exit /b 1

      - name: Instala DirectX SDK
        run: |
          $url = "https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe"
          $out = "$env:TEMP\DXSDK_Jun10.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          Start-Process -FilePath $out -ArgumentList "/U" -Wait
          echo "DXSDK_DIR=C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Verifica fonte de autenticacao
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath "src/Security/Api/api.hpp")) {
            throw "Fonte de autenticacao ausente; compilacao interrompida."
          }

      - name: Compila Release x64
        run: |
          $env:CL = "/utf-8"
          msbuild "Wexize Revamp.sln" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m /nologo
        shell: pwsh

      - name: Verifica executável
        run: |
          Write-Host "Conteúdo da pasta x64\Release:"
          Get-ChildItem -Path "x64\Release" -File -ErrorAction SilentlyContinue | Select-Object Name, Length
          if (!(Get-ChildItem -Path "x64\Release" -Filter *.exe -File -ErrorAction SilentlyContinue)) {
            Write-Error "Nenhum .exe encontrado em x64\Release."
            exit 1
          }
        shell: pwsh

      - name: Registra versao e hashes
        shell: pwsh
        run: |
          $files = @("x64/Release/Wexize Revamp.exe", "x64/Release/FiveMMenuBridge.dll")
          $hashes = @{}
          foreach ($file in $files) {
            if (!(Test-Path -LiteralPath $file)) { throw "Artefato ausente: $file" }
            $hashes[[IO.Path]::GetFileName($file)] = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
          }
          @{
            commit = "${{ github.sha }}"
            run = "${{ github.run_id }}"
            bridge_protocol = 7
            bridge_builds = @(3258, 3889)
            in_game_validation = "pending"
            sha256 = $hashes
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath "x64/Release/build-info.json" -Encoding utf8

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Wexize-EXE
          path: |
            x64/Release/*.exe
            x64/Release/FiveMMenuBridge.dll
            x64/Release/build-info.json
            docs/ponte-3889.md
            SkinChangerLocal/**
          if-no-files-found: error
